name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-lint-frontend:
    name: Frontend - Instalación, Lint y Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./unride-frontend
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Puedes cambiar esto a la versión exacta que usen
          cache: 'npm'
          cache-dependency-path: ./unride-frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Linter (Revisión de formato)
        run: npm run lint

      - name: Ejecutar Build (Validar construcción)
        run: npm run build

  build-backend:
    name: Backend - Instalación de dependencias
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./uniride-backend
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./uniride-backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci
